{% extends 'bikes/base.html' %}

{% block content %}
<div style="max-width: 420px; margin: 40px auto; background: #1a1a1a; padding: 35px; border-radius: 12px; border: 1px solid #333; color: white; box-shadow: 0px 4px 15px rgba(0,0,0,0.5);">
    <h2 style="color: #d11a2a; margin-bottom: 25px; text-align: center; font-size: 24px; font-weight: bold;">Create an Account</h2>
    
    {% if error %}
        <div style="background-color: #d11a2a; color: white; padding: 10px; border-radius: 6px; font-size: 14px; margin-bottom: 20px; text-align: center;">
            {{ error }}
        </div>
    {% endif %}

    <form method="POST">
        {% csrf_token %}
        
        <div style="margin-bottom: 15px;">
            <label style="display: block; margin-bottom: 6px; font-weight: bold; font-size: 14px; color: #ccc;">Full Name</label>
            <input type="text" name="full_name" placeholder="Enter your full name" required style="width: 100%; padding: 12px; border-radius: 6px; border: 1px solid #444; background: #2b2b2b; color: white; outline: none; font-size: 14px; box-sizing: border-box;">
        </div>

        <div style="margin-bottom: 15px;">
            <label style="display: block; margin-bottom: 6px; font-weight: bold; font-size: 14px; color: #ccc;">Email Address</label>
            <input type="email" name="email" placeholder="Enter your email" required style="width: 100%; padding: 12px; border-radius: 6px; border: 1px solid #444; background: #2b2b2b; color: white; outline: none; font-size: 14px; box-sizing: border-box;">
        </div>

        <div style="margin-bottom: 15px;">
            <label style="display: block; margin-bottom: 6px; font-weight: bold; font-size: 14px; color: #ccc;">Phone Number</label>
            <input type="tel" name="phone" placeholder="Enter mobile number" required style="width: 100%; padding: 12px; border-radius: 6px; border: 1px solid #444; background: #2b2b2b; color: white; outline: none; font-size: 14px; box-sizing: border-box;">
        </div>

        <div style="margin-bottom: 15px;">
            <label style="display: block; margin-bottom: 6px; font-weight: bold; font-size: 14px; color: #ccc;">Password</label>
            <input type="password" name="password" placeholder="Create password" required style="width: 100%; padding: 12px; border-radius: 6px; border: 1px solid #444; background: #2b2b2b; color: white; outline: none; font-size: 14px; box-sizing: border-box;">
        </div>

        <div style="margin-bottom: 25px;">
            <label style="display: block; margin-bottom: 6px; font-weight: bold; font-size: 14px; color: #ccc;">Confirm password</label>
            <input type="password" name="confirm_password" placeholder="Confirm password" required style="width: 100%; padding: 12px; border-radius: 6px; border: 1px solid #444; background: #2b2b2b; color: white; outline: none; font-size: 14px; box-sizing: border-box;">
        </div>

        <button type="submit" style="width: 100%; background-color: #d11a2a; color: white; padding: 12px; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer;">Register</button>
    </form>
    
    <p style="text-align: center; margin-top: 20px; color: #aaa; font-size: 14px;">
        Already have an account? <a href="{% url 'login' %}" style="color: #d11a2a; text-decoration: none; font-weight: bold;">Login here</a>
    </p>
</div>
{% endblock %}
