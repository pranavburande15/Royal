{% extends 'bikes/base.html' %}

{% block content %}
<div style="max-width: 420px; margin: 50px auto; background: #1a1a1a; padding: 35px; border-radius: 12px; border: 1px solid #333; color: white; box-shadow: 0px 4px 15px rgba(0,0,0,0.5);">
    <h2 style="color: #d11a2a; margin-bottom: 25px; text-align: center; font-size: 24px; font-weight: bold;">Login to Showroom</h2>
    
    <form method="POST">
        {% csrf_token %}
        
        <div style="margin-bottom: 20px;">
            <label style="display: block; margin-bottom: 8px; font-weight: bold; font-size: 14px; color: #ccc;">Username</label>
            <input type="text" name="username" placeholder="Enter your username" required style="width: 100%; padding: 12px; border-radius: 6px; border: 1px solid #444; background: #2b2b2b; color: white; outline: none; font-size: 14px; box-sizing: border-box;">
        </div>

        <div style="margin-bottom: 25px;">
            <label style="display: block; margin-bottom: 8px; font-weight: bold; font-size: 14px; color: #ccc;">Password</label>
            <input type="password" name="password" placeholder="Enter your password" required style="width: 100%; padding: 12px; border-radius: 6px; border: 1px solid #444; background: #2b2b2b; color: white; outline: none; font-size: 14px; box-sizing: border-box;">
        </div>

        <button type="submit" style="width: 100%; background-color: #d11a2a; color: white; padding: 12px; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s;">Login</button>
    </form>
    
    <p style="text-align: center; margin-top: 20px; color: #aaa; font-size: 14px;">
        Don't have an account? <a href="{% url 'register' %}" style="color: #d11a2a; text-decoration: none; font-weight: bold;">Register here</a>
    </p>
</div>
{% endblock %}
