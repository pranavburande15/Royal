<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Royal Enfield Showroom</title>
        <style>
            *{
                margin:0;
                padding:0;
                box-sizing:border-box;
                font-family:'Segoe UI',Tahoma, Geneva, sans-serif;
            }
            body{
                background-color:#121212;
                color:#ffffff;
            }
            header{
                background-color: #000000;
                padding: 20px 50px;
                display: flex;
                justify-content: space-between;
                align-items: center;
                border-bottom: 3px solid #b30000;
            }
            .logo {
                font-size: 28px;
                font-weight: bold;
                color: #d11a2a;
                letter-spacing: 2px;
             text-transform: uppercase;
            }
            nav a {
                color: #fff;
                text-decoration: none;
                margin-left: 20px;
                font-weight: 500;
                transition: 0.3s;
            }
             nav a:hover {
                color: #d11a2a;
            }
            .container {
                max-width: 1200px;
                margin: 40px auto;
                padding: 0 20px;
            }
            footer {
                text-align: center;
                padding: 20px;
                background-color: #000;
                color: #888;
                margin-top: 50px;
                border-top: 1px solid #333;
            }
    
        </style>
    </head>
    <body>
        <header>
            <div class="logo"> Royal Enfield</div>
                <nav>
                    <a href="{% url 'home' %}">Home</a>
                    <a href="{% url 'my_bookings' %}">My Booking</a>
                    <a href="{% url 'contact' %}">Contact</a>
                    {% if user.is_authenticated %}
                        <a href="{% url 'profile' %}">Profile</a>
                        
                    {% else %}
                        <a href="{% url 'login' %}">Login</a>
                        
                    {% endif %}
                </nav>
                {% if messages %}
                    <div style="max-width: 800px; margin: 15px auto; padding: 0 20px;">
                        {% for message in messages %}
                        <div style="background-color: #28a745; color: white; padding: 12px; border-radius: 6px; text-align: center; font-weight: bold; box-shadow: 0px 3px 10px rgba(0,0,0,0.3);">
                    {{ message }}
                    </div>
                    {% endfor %}
                {% endif %}
            </div>
        </header>
        <div class="container">
            {% block content %}{% endblock %}
        </div>
        <footer>
            <p>&copy; 2026 Royal Enfield Showroom System | Mr.Pranav Burande's Project</p>
        </footer>
    </body>
</html>
